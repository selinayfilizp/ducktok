[project]
name = "ducktok"
version = "0.1.0"
description = "Beat-grid choreography compiler for motion-imitation RL: write a TikTok dance as YAML, train it on a robot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Selinay Parlak" }]
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.scripts]
ducktok = "ducktok.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ducktok"]
